name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # src/lib/api-types.ts is generated from the API's OpenAPI document and
      # committed. Regenerating it needs both repositories checked out side by
      # side, so it runs locally (`npm run gen:api`) rather than here; the API
      # repository's own CI proves that document matches its controllers.
      - run: npm run build
